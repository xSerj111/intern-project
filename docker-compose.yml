services:
  postgres:
    image: postgres:15
    container_name: innogram-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Consumed by the init script below, which creates the per-service databases.
      DB_NAME_AUTH: ${DB_NAME_AUTH}
      DB_NAME_CORE: ${DB_NAME_CORE}
      DB_NAME_NOTIFICATIONS: ${DB_NAME_NOTIFICATIONS}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    networks:
      - innogram-network

  redis:
    image: redis:7-alpine
    container_name: innogram-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - innogram-network

  # Cache store for core (US5). Persistence is off and memory is capped, so
  # it holds no durable state and needs no volume.
  redis-cache:
    image: redis:7-alpine
    container_name: innogram-redis-cache
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6380:6379"
    networks:
      - innogram-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: innogram-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - innogram-network

  mailpit:
    image: axllent/mailpit
    container_name: innogram-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - innogram-network

  # S3-compatible storage for core assets. Host port 9000 is kept so the URLs
  # stored in the DB (http://localhost:9000/<bucket>/<key>) stay valid.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: innogram-seaweedfs
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      # Read by entrypoint.sh for the S3 CORS allow-list (-s3.allowedOrigins).
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
    ports:
      - "9000:8333"
    volumes:
      - ./docker/seaweedfs/entrypoint.sh:/entrypoint.sh:ro
      - seaweedfs_data:/data
    healthcheck:
      # The master binds to the container IP, not localhost.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://$$(hostname -i):9333/cluster/status"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - innogram-network

  # One-shot: creates the buckets, then exits. The public-read rule for
  # innogram-assets lives in the identities file rendered by entrypoint.sh.
  seaweedfs-setup:
    image: chrislusf/seaweedfs:4.48
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    # Creates only the buckets that are missing, so a re-run exits 0.
    command: >
      "for b in innogram-assets innogram-private; do
      if ! printf 's3.bucket.list\n' | weed shell -master=seaweedfs:9333 | grep -qw \"$$b\"; then
      printf \"s3.bucket.create -name $$b\n\" | weed shell -master=seaweedfs:9333;
      fi;
      done;
      echo 'SeaweedFS buckets ready'"
    networks:
      - innogram-network

  # Optional monitoring stack: `docker compose --profile monitoring up -d`.
  # Scrapes the services running on the host; nothing else depends on it.
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: innogram-prometheus
    profiles: ["monitoring"]
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    environment:
      # Written to /run/secrets/internal_token by entrypoint.sh; never logged.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tmpfs:
      # 65534 = the nobody user Prometheus runs as.
      - /run/secrets:uid=65534,gid=65534,mode=0700
    volumes:
      - ./docker/monitoring/entrypoint.sh:/entrypoint.sh:ro
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - innogram-network

  grafana:
    image: grafana/grafana:12.2.0
    container_name: innogram-grafana
    profiles: ["monitoring"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3030:3000"
    volumes:
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - innogram-network

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
  prometheus_data:
  grafana_data:

networks:
  innogram-network:
    driver: bridge
