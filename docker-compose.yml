services:
  postgres:
    image: postgres:15
    container_name: innogram-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Consumed by the init script below, which creates the per-service databases.
      DB_NAME_AUTH: ${DB_NAME_AUTH}
      DB_NAME_CORE: ${DB_NAME_CORE}
      DB_NAME_NOTIFICATIONS: ${DB_NAME_NOTIFICATIONS}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    networks:
      - innogram-network

  redis:
    image: redis:7-alpine
    container_name: innogram-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - innogram-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: innogram-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - innogram-network

  mailpit:
    image: axllent/mailpit
    container_name: innogram-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - innogram-network

  # S3-compatible storage for core assets. Host port 9000 is kept so the URLs
  # stored in the DB (http://localhost:9000/<bucket>/<key>) stay valid.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: innogram-seaweedfs
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - "9000:8333"
    volumes:
      - ./docker/seaweedfs/entrypoint.sh:/entrypoint.sh:ro
      - seaweedfs_data:/data
    healthcheck:
      # The master binds to the container IP, not localhost.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://$$(hostname -i):9333/cluster/status"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - innogram-network

  # One-shot: creates the buckets, then exits. The public-read rule for
  # innogram-assets lives in the identities file rendered by entrypoint.sh.
  seaweedfs-setup:
    image: chrislusf/seaweedfs:4.48
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    # Creates only the buckets that are missing, so a re-run exits 0.
    command: >
      "for b in innogram-assets innogram-private; do
      if ! printf 's3.bucket.list\n' | weed shell -master=seaweedfs:9333 | grep -qw \"$$b\"; then
      printf \"s3.bucket.create -name $$b\n\" | weed shell -master=seaweedfs:9333;
      fi;
      done;
      echo 'SeaweedFS buckets ready'"
    networks:
      - innogram-network

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:

networks:
  innogram-network:
    driver: bridge
