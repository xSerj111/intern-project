name: Innogram CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
    types: [opened, synchronize, reopened]

jobs:
  # Job 1: Lint and Type-check for the entire monorepo
  lint-and-type-check:
    name: Lint & Type-Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (via Turborepo)
        # Turborepo will run the "lint" script in all applications under the /apps folder
        run: npx turbo run lint

      - name: Type-Check (Build via Turborepo)
        # Turborepo will build all applications, ensuring type correctness
        run: npx turbo run build

  # Job 2: Unit tests ONLY within Core Microservice
  unit-tests:
    name: Core Microservice Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (Core Microservice)
        # Navigate directly to the core_microservice folder and run tests
        working-directory: ./apps/core_microservice
        run: npm run test