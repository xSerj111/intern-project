name: Innogram Docker Images

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  # Builds every service image; pushes to GHCR only for non-PR events
  build-images:
    name: Image (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: auth, app: auth_microservice, dockerfile: apps/auth_microservice/Dockerfile }
          - { name: core, app: core_microservice, dockerfile: apps/core_microservice/Dockerfile }
          - { name: notifications, app: notifications_consumer_microservice, dockerfile: apps/notifications_consumer_microservice/Dockerfile }
          # Browser-visible URLs are baked into the client bundle at build time
          - name: client
            app: client_app
            dockerfile: apps/client_app/Dockerfile
            build_args: |
              AUTH_SERVICE_URL=${{ vars.AUTH_SERVICE_URL || 'http://localhost:3002' }}
              CORE_SERVICE_URL=${{ vars.CORE_SERVICE_URL || 'http://localhost:3001' }}
              NOTIFICATIONS_SERVICE_URL=${{ vars.NOTIFICATIONS_SERVICE_URL || 'http://localhost:3003' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase repository owner
        # GHCR image names must be lowercase
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/innogram-${{ matrix.name }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
