# Scrapes the services listed in PROMETHEUS_TARGETS (default: core, auth and
# notifications on the host). entrypoint.sh writes them to /run/sd/targets.json
# with a `service` label each. /metrics is internal: the token comes from a file
# written by entrypoint.sh, never from this repo. The apps also export their own
# `service` label; honor_labels keeps that one on conflict (same values).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: innogram
    metrics_path: /metrics
    honor_labels: true
    http_headers:
      X-Internal-Token:
        files: [/run/secrets/internal_token]
    file_sd_configs:
      - files: [/run/sd/targets.json]
        refresh_interval: 1m
